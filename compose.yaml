services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_HTTPS: "1"
      PUBLIC_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
      VAPID_SUBJECT: https://${SITE_HOST}
      TRUST_PROXY: "1"
    volumes:
      - wash_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  wash_data:
  caddy_data:
  caddy_config:
